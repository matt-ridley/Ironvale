# Runs the rules engine and offline-install tests on every pull request and push to main,
# so a pull request shows a green check (or a red cross) before it's merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
